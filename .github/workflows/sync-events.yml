name: Auto-Sync Multi-Platform Events

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Multi-Platform Event Crawler
        run: node scripts/crawl-events.js

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync multi-platform event database" && git push)
