<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ravi Teja Bitra - Running Gear. Profile of active running shoes and gear in rotation.">
  <title>Running Gear | Ravi Teja Bitra</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    @keyframes floatShoe {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }
    .shoe-image {
      animation: floatShoe 4s ease-in-out infinite;
    }
    .shoe-graphic-container:hover .shoe-image {
      animation-play-state: paused;
      transform: translateY(-10px) scale(1.03);
    }
    .shoe-graphic-container:hover .shoe-glow {
      transform: translate(-50%, -50%) scale(1.25);
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header id="header">
    <div class="container nav-content">
      <a href="index.html" class="logo">Ravi<span>.</span></a>
      <ul class="nav-links">
        <li><a href="index.html#about">Profile</a></li>
        <li><a href="index.html#activities">Activities</a></li>
        <li><a href="index.html#connect">Connect</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    
    <!-- Back Button -->
    <a href="running.html" class="back-btn">← Back to Running Log</a>

    <!-- Page Header -->
    <div class="hero" style="margin-bottom: 48px;">
      <div class="hero-eyebrow">RUNNING GEAR</div>
      <h1 class="hero-title" style="margin-bottom: 16px;">Running <span class="accent">Gear.</span></h1>
      <p class="hero-bio" style="font-size: 1.05rem;">
        An overview of active running shoes and log distance tracked via Google Sheets.
      </p>
    </div>

    <!-- Gear Details Section -->
    <div class="stats-dashboard" style="grid-template-columns: 1fr; gap: 24px;">
      <div class="stat-hero-card">
        <span class="stat-lbl" style="font-size: 0.95rem; color: var(--theme-color); margin-bottom: 20px; font-weight: 700; text-transform: uppercase;">Active Running Shoes (Google Sheet Log)</span>
        
        <div id="shoes-container" style="display: flex; flex-direction: column; gap: 32px; width: 100%;">
          <!-- Rendered dynamically from Google Sheet / API -->
          <div style="color: var(--text-muted); font-size: 0.9rem;">Loading shoe mileage logs...</div>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-inner">
      <div class="footer-socials">
        <a href="https://www.strava.com/athletes/ravitejabitra" target="_blank" rel="noopener noreferrer" class="social-link">Strava</a>
        <a href="https://www.instagram.com/raviteja_bitra" target="_blank" rel="noopener noreferrer" class="social-link">Instagram</a>
        <a href="https://www.youtube.com/@Raviteja_Bitra" target="_blank" rel="noopener noreferrer" class="social-link">YouTube</a>
      </div>
      <p class="copyright">&copy; 2026 Ravi Teja Bitra</p>
    </div>
  </footer>

  <script>
    async function loadShoeLogs() {
      const container = document.getElementById('shoes-container');

      try {
        const res = await fetch('/api/shoes');
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();

        const shoes = data.shoes || [];
        if (shoes.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted);">No shoe logs found in Google Sheet.</div>';
          return;
        }

        container.innerHTML = '';

        shoes.forEach((shoe, idx) => {
          const isPumaEkiden = shoe.name.toLowerCase().includes('ekiden') || shoe.name.toLowerCase().includes('deviate');
          const goal = shoe.goal_km || 700;
          const dist = parseFloat((shoe.total_distance_km || 0).toFixed(1));
          const pct = Math.min(100, Math.max(0, (dist / goal) * 100)).toFixed(1);
          const isLast = idx === shoes.length - 1;

          const item = document.createElement('div');
          item.style.cssText = `${!isLast ? 'border-bottom: 1px solid var(--border-color); padding-bottom: 28px;' : ''} display: flex; flex-direction: row; flex-wrap: wrap; gap: 24px; align-items: center;`;

          const graphicHTML = isPumaEkiden ? `
            <div class="shoe-graphic-container" style="flex: 1 1 240px; min-height: 200px; display: flex; justify-content: center; align-items: center; background: rgba(59, 130, 246, 0.02); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; position: relative; padding: 16px;">
              <img src="puma-deviate-nitro-3-ekiden.png" alt="${shoe.name}" class="shoe-image" style="max-height: 170px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3)); transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);">
              <div class="shoe-glow" style="position: absolute; width: 140px; height: 140px; background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.5; transition: all 0.4s ease;"></div>
            </div>
          ` : '';

          item.innerHTML = `
            ${graphicHTML}
            <div style="flex: 2 1 300px;">
              <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px;">${shoe.name}</h3>
              <div style="display: flex; gap: 12px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 14px;">
                <span style="color: var(--theme-color);">Google Sheet Log</span>
                <span style="color: var(--text-muted);">|</span>
                <span style="color: var(--text-secondary);">${shoe.latest_date || 'Active'}</span>
              </div>

              <!-- Shoe Lifespan Mileage Progress Bar -->
              <div style="padding-top: 14px; border-top: 1px dashed var(--border-color);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">
                  <span style="color: var(--text-muted); letter-spacing: 0.05em;">Lifespan Progress</span>
                  <span style="color: var(--theme-color); font-size: 0.95rem; font-weight: 800;">${dist} / ${goal} km</span>
                </div>
                <div style="width: 100%; height: 10px; background: rgba(255, 255, 255, 0.06); border-radius: 999px; overflow: hidden; border: 1px solid var(--border-color); position: relative;">
                  <div style="width: ${pct}%; height: 100%; background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%); border-radius: 999px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);"></div>
                </div>
              </div>
            </div>
          `;
          container.appendChild(item);
        });

      } catch (err) {
        console.error('Shoe log fetch error:', err);
        container.innerHTML = `
          <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center;">
            <div class="shoe-graphic-container" style="flex: 1 1 240px; min-height: 200px; display: flex; justify-content: center; align-items: center; background: rgba(59, 130, 246, 0.02); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; position: relative; padding: 16px;">
              <img src="puma-deviate-nitro-3-ekiden.png" alt="Puma Deviate Nitro 3 Ekiden" class="shoe-image" style="max-height: 170px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3)); transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);">
              <div class="shoe-glow" style="position: absolute; width: 140px; height: 140px; background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.5; transition: all 0.4s ease;"></div>
            </div>
            
            <div style="flex: 2 1 300px;">
              <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px;">Puma Deviate Nitro 3 Ekiden</h3>
              <div style="display: flex; gap: 12px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 14px;">
                <span style="color: var(--theme-color);">Google Sheet Log</span>
                <span style="color: var(--text-muted);">|</span>
                <span style="color: var(--text-secondary);">Till Aug 14th 2026</span>
              </div>

              <div style="padding-top: 14px; border-top: 1px dashed var(--border-color);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">
                  <span style="color: var(--text-muted); letter-spacing: 0.05em;">Lifespan Progress</span>
                  <span style="color: var(--theme-color); font-size: 0.95rem; font-weight: 800;">87.2 / 700 km</span>
                </div>
                <div style="width: 100%; height: 10px; background: rgba(255, 255, 255, 0.06); border-radius: 999px; overflow: hidden; border: 1px solid var(--border-color); position: relative;">
                  <div style="width: 12.5%; height: 100%; background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%); border-radius: 999px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);"></div>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    loadShoeLogs();
  </script>
  <script src="app.js"></script>
</body>
</html>
